name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: andrey-fomin/ccval@v0

  smoke-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve upstream release
        id: release
        run: python3 scripts/typos_release.py metadata --github-output "$GITHUB_OUTPUT"

      - name: Build smoke-test image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg TYPOS_VERSION=${{ steps.release.outputs.version }} \
            --load \
            --tag typos-smoke:test \
            .

      - name: Verify image entrypoint
        run: docker run --rm typos-smoke:test --version
